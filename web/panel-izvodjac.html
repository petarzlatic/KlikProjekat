<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dostupni zahtevi — Usklik.rs</title>
<link rel="icon" type="image/png" href="img/usklik-icon-192.png" />
<link rel="apple-touch-icon" href="img/usklik-icon-180.png" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="ku-demo-banner" class="demo-banner"></div>
<header id="ku-header" class="site-header"></header>

<div class="page-wrap">
  <div class="container">
    <div class="flex-between mt-2" style="flex-wrap:wrap; gap:12px;">
      <div>
        <h1 class="mb-0">Zdravo, <span id="ku-user-ime"></span></h1>
        <p class="mb-0">Pregledaj zahteve klijenata i javi se na one koji ti odgovaraju.</p>
      </div>
      <a href="moj-profil.html" class="btn btn-outline">Uredi moj profil</a>
    </div>

    <div class="tabs mt-5">
      <button class="tab-btn active" data-tab="dostupni" type="button">Dostupni zahtevi</button>
      <button class="tab-btn" data-tab="predlozi" type="button">Predložene ponude <span id="ku-predlozi-broj"></span></button>
      <button class="tab-btn" data-tab="moje" type="button">Moje ponude</button>
    </div>

    <div id="tab-dostupni">
      <div class="filter-bar">
        <select id="ku-filter-kat"></select>
        <select id="ku-filter-loc"></select>
      </div>
      <div id="ku-open-list"></div>
    </div>

    <!-- Hibridni mehanizam v2 — sistem sam obračuna cenu na osnovu majstorovog
         cenovnika i predloži ponudu; klijent je ne vidi dok je majstor ovde
         ne potvrdi ili ne odbije. -->
    <div id="tab-predlozi" style="display:none;">
      <p class="small muted mt-3">Ovo su ponude koje je sistem sam obračunao na osnovu tvog cenovnika. Klijent ih još ne vidi — proveri iznos i potvrdi, ili odbij ako ti ne odgovara.</p>
      <div id="ku-predlozi-list"></div>
    </div>

    <div id="tab-moje" style="display:none;">
      <div id="ku-my-offers-list"></div>
    </div>
  </div>
</div>

<footer id="ku-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/common.js"></script>
<script>
(async () => {
  await KU.ready;
  const user = kuRequireAuth("izvodjac");
  if (!user) return;

  function aktivirajTab(tabId) {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tabId));
    document.getElementById("tab-dostupni").style.display = tabId === "dostupni" ? "block" : "none";
    document.getElementById("tab-predlozi").style.display = tabId === "predlozi" ? "block" : "none";
    document.getElementById("tab-moje").style.display = tabId === "moje" ? "block" : "none";
  }

  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => aktivirajTab(btn.dataset.tab));
  });

  // Hibridni mehanizam v2 — link sa banera na zahtev.html
  // ("Otvori 'Predložene ponude'...") vodi ovde sa ?tab=predlozi, da
  // majstor sleti direktno na tačan tab umesto na podrazumevani
  // "Dostupni zahtevi" (gde je lako pobrkati dugme "Javi se" za ručnu
  // ponudu sa potvrđivanjem automatskog predloga).
  const zeljeniTab = kuQueryParam("tab");
  if (zeljeniTab === "predlozi" || zeljeniTab === "moje") {
    aktivirajTab(zeljeniTab);
  }

  function fillFilters() {
    const katSelect = document.getElementById("ku-filter-kat");
    katSelect.innerHTML =
      '<option value="">Sve moje kategorije</option>' +
      (user.kategorije || []).map((id) => `<option value="${id}">${kuEscape(kuKategorijaNaziv(id))}</option>`).join("");

    const locSelect = document.getElementById("ku-filter-loc");
    locSelect.innerHTML =
      '<option value="">Sve lokacije</option>' +
      KU_CONFIG.LOKACIJE.map((l) => `<option value="${l}">${kuEscape(l)}</option>`).join("");

    katSelect.addEventListener("change", renderOpen);
    locSelect.addEventListener("change", renderOpen);
  }

  async function renderOpen() {
    const katFilter = document.getElementById("ku-filter-kat").value;
    const locFilter = document.getElementById("ku-filter-loc").value;
    const myKats = user.kategorije || [];

    let requests = (await KU.store.getRequests()).filter((r) => r.status === "otvoren" && myKats.includes(r.kategorija));
    if (katFilter) requests = requests.filter((r) => r.kategorija === katFilter);
    if (locFilter) requests = requests.filter((r) => r.lokacija === locFilter);

    const mount = document.getElementById("ku-open-list");
    if (requests.length === 0) {
      mount.innerHTML = `
        <div class="empty-state card mt-4">
          <div class="icon-circle">🔍</div>
          <h3>Trenutno nema otvorenih zahteva</h3>
          <p>U tvojim kategorijama i izabranoj lokaciji nema zahteva koji čekaju ponudu. Proveri kasnije.</p>
        </div>`;
      return;
    }

    async function requestCard(r) {
      const client = await KU.store.getUserById(r.klijentId);
      // Hibridni mehanizam v2 — ako sistem već ima automatski predlog za
      // OVAJ zahtev (čeka majstorovu potvrdu), prikaži to umesto običnog
      // "Javi se" dugmeta — u suprotnom su "Detalji" i "Javi se" izgledali
      // kao dva ista ekrana, jer zahtev.html u tom slučaju svejedno
      // prikazuje baner sa predlogom umesto forme za ručnu ponudu.
      const [alreadyOffered, mojPredlog] = await Promise.all([
        KU.store.hasOffered(r.id, user.id),
        kuKategorijaAutomatska(r.kategorija) ? KU.store.getMojPredlogZaZahtev(r.id, user.id) : null,
      ]);
      const terminText = kuFormatTermin(r);
      let akcijaHtml;
      if (mojPredlog) {
        akcijaHtml = `<a class="btn btn-primary btn-sm" href="panel-izvodjac.html?tab=predlozi">🧮 Čeka tvoju potvrdu</a>`;
      } else if (alreadyOffered) {
        akcijaHtml = '<span class="badge badge-pending">Već si se javio/la</span>';
      } else {
        akcijaHtml = `<a class="btn btn-primary btn-sm" href="zahtev.html?id=${r.id}#ponudi">Javi se</a>`;
      }
      return `
        <div class="card card-hover mt-4" ${r.hitno ? 'style="border-color:rgba(197,61,61,0.4);"' : ""}>
          <div class="flex-between" style="flex-wrap:wrap; gap:8px;">
            <div class="flex gap-2" style="flex-wrap:wrap;">
              <span class="badge" style="background:var(--color-primary-lighter); color:var(--color-primary);">${kuEscape(kuKategorijaNaziv(r.kategorija))}</span>
              ${r.hitno ? '<span class="badge badge-hitno"><span class="siren"></span> HITNO</span>' : ""}
            </div>
            <span class="small muted">${kuFormatDate(r.createdAt)}</span>
          </div>
          <h3 class="mt-2">${kuEscape(r.opis)}</h3>
          <p class="small mb-0">📍 ${kuEscape(r.lokacija)} ${terminText ? "· 🗓 " + kuEscape(terminText) : ""}</p>
          <p class="small muted">Klijent: ${kuEscape(client ? client.ime : "—")}</p>
          <div class="flex-between mt-3">
            <a class="btn btn-outline btn-sm" href="zahtev.html?id=${r.id}">Detalji</a>
            ${akcijaHtml}
          </div>
        </div>`;
    }

    const hitni = requests.filter((r) => r.hitno);
    const regularni = requests.filter((r) => !r.hitno);
    const hitniCards = await Promise.all(hitni.map(requestCard));
    const regularniCards = await Promise.all(regularni.map(requestCard));

    let html = "";
    if (hitni.length > 0) {
      html += `<h2 class="mt-5" style="color:var(--color-danger);"><span class="siren"></span> Hitne intervencije</h2>` + hitniCards.join("");
      if (regularni.length > 0) html += `<h2 class="mt-6">Regularni zahtevi</h2>`;
    }
    html += regularniCards.join("");
    mount.innerHTML = html;
  }

  /* Hibridni mehanizam v2 — "Predložene ponude" (automatske, status 'nacrt').
     Majstor ovde vidi obračunatu cenu i bira Potvrdi/Odbij; dok se ne izjasni,
     klijent tu ponudu uopšte ne vidi. */
  async function renderPredlozi() {
    const predlozi = await KU.store.getPredlozenePonude(user.id);
    const brojEl = document.getElementById("ku-predlozi-broj");
    brojEl.textContent = predlozi.length > 0 ? `(${predlozi.length})` : "";

    const mount = document.getElementById("ku-predlozi-list");
    if (predlozi.length === 0) {
      mount.innerHTML = `
        <div class="empty-state card mt-4">
          <div class="icon-circle">🧮</div>
          <h3>Trenutno nema predloga</h3>
          <p>Kad stigne novi zahtev za uslugu iz tvog cenovnika, sistem će ovde predložiti obračunatu cenu.</p>
        </div>`;
      return;
    }

    const cards = await Promise.all(predlozi.map(async (o) => {
      const req = await KU.store.getRequestById(o.requestId);
      if (!req) return "";
      return `
        <div class="card mt-4" data-offer-id="${o.id}">
          <div class="flex-between" style="flex-wrap:wrap; gap:8px;">
            <div>
              <span class="badge" style="background:var(--color-primary-lighter); color:var(--color-primary);">${kuEscape(kuKategorijaNaziv(req.kategorija))}</span>
              <h3 class="mt-2 mb-0">${kuEscape(req.opis).slice(0, 90)}${req.opis.length > 90 ? "…" : ""}</h3>
            </div>
            <span class="badge badge-pending">Obračunata cena: ${o.cena != null ? Number(o.cena).toLocaleString("sr-RS") + " RSD" : "—"}</span>
          </div>
          <p class="small mt-2 mb-0">📍 ${kuEscape(req.lokacija)} ${kuFormatTermin(req) ? "· 🗓 " + kuEscape(kuFormatTermin(req)) : ""}</p>
          <p class="small mt-2 mb-0">${kuEscape(o.poruka)}</p>
          <div class="flex-between mt-3" style="flex-wrap:wrap; gap:8px;">
            <a class="btn btn-outline btn-sm" href="zahtev.html?id=${req.id}">Detalji zahteva</a>
            <div class="flex gap-2">
              <button type="button" class="btn btn-outline btn-sm ku-odbij-predlog">Ne mogu</button>
              <button type="button" class="btn btn-primary btn-sm ku-potvrdi-predlog">Potvrdi ponudu</button>
            </div>
          </div>
        </div>`;
    }));
    mount.innerHTML = cards.join("");

    mount.querySelectorAll(".ku-potvrdi-predlog").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const card = btn.closest("[data-offer-id]");
        const offerId = card.dataset.offerId;
        btn.disabled = true;
        try {
          await KU.store.potvrdiAutomatskuPonudu(offerId);
          kuToast("Ponuda potvrđena — klijent je sad vidi.");
          await renderPredlozi();
          await renderMyOffers();
        } catch (err) {
          kuToast("Greška: " + err.message);
          btn.disabled = false;
        }
      });
    });
    mount.querySelectorAll(".ku-odbij-predlog").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const card = btn.closest("[data-offer-id]");
        const offerId = card.dataset.offerId;
        btn.disabled = true;
        try {
          await KU.store.odbijAutomatskuPonudu(offerId);
          kuToast("Predlog odbijen.");
          await renderPredlozi();
        } catch (err) {
          kuToast("Greška: " + err.message);
          btn.disabled = false;
        }
      });
    });
  }

  async function renderMyOffers() {
    const offers = (await KU.store.getOffersByIzvodjac(user.id)).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    const mount = document.getElementById("ku-my-offers-list");
    if (offers.length === 0) {
      mount.innerHTML = `
        <div class="empty-state card mt-4">
          <div class="icon-circle">💬</div>
          <h3>Još nisi poslao/la nijednu ponudu</h3>
          <p>Kad se javiš na neki zahtev, tu ponudu ćeš pratiti ovde.</p>
        </div>`;
      return;
    }
    const cards = await Promise.all(offers.map(async (o) => {
      const req = await KU.store.getRequestById(o.requestId);
      if (!req) return "";
      let statusHtml = '<span class="badge badge-pending">Čeka odgovor</span>';
      if (o.status === "prihvacena") statusHtml = '<span class="badge badge-open">Prihvaćena — imaš kontakt</span>';
      if (o.status === "odbijena") statusHtml = '<span class="badge badge-done">Klijent je izabrao drugog</span>';
      const cenaDelovi = [];
      if (o.cenaIzlaska != null) cenaDelovi.push(`Izlazak: ${o.cenaIzlaska} din`);
      if (o.cenaPopravkeOd != null && o.cenaPopravkeDo != null) cenaDelovi.push(`Popravka: ${o.cenaPopravkeOd}–${o.cenaPopravkeDo} din`);
      const detaljLinija = cenaDelovi.length
        ? cenaDelovi.join(" · ") + (o.poruka ? ` — „${kuEscape(o.poruka)}"` : "")
        : `Tvoja poruka: „${kuEscape(o.poruka)}"`;
      return `
        <a href="zahtev.html?id=${req.id}" class="card card-hover card-link mt-4" style="display:block;">
          <div class="flex-between" style="flex-wrap:wrap; gap:8px;">
            <div>
              <span class="badge" style="background:var(--color-primary-lighter); color:var(--color-primary);">${kuEscape(kuKategorijaNaziv(req.kategorija))}</span>
              ${req.hitno ? '<span class="badge badge-hitno"><span class="siren"></span> HITNO</span>' : ""}
              <h3 class="mt-2 mb-0">${kuEscape(req.opis).slice(0, 90)}${req.opis.length > 90 ? "…" : ""}</h3>
            </div>
            ${statusHtml}
          </div>
          <p class="small mt-2 mb-0">${detaljLinija}</p>
        </a>`;
    }));
    mount.innerHTML = cards.join("");
  }

  document.getElementById("ku-user-ime").textContent = user ? user.ime.split(" ")[0] : "";
  fillFilters();
  await renderOpen();
  await renderPredlozi();
  await renderMyOffers();
})().catch((err) => { console.error(err); kuToast("Greška: " + err.message); });
</script>
</body>
</html>
