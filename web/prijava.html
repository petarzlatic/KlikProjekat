<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prijava — Usklik.rs</title>
<link rel="icon" type="image/png" href="img/usklik-icon-192.png" />
<link rel="apple-touch-icon" href="img/usklik-icon-180.png" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="ku-demo-banner" class="demo-banner"></div>
<header id="ku-header" class="site-header"></header>

<div class="page-wrap">
  <div class="container-narrow">
    <h1>Prijava</h1>
    <p>Prijavi se svojim nalogom.</p>

    <div class="error-box" id="ku-error"></div>
    <div class="success-box" id="ku-success" style="display:none;"></div>

    <form id="ku-login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Lozinka</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Prijavi se</button>
      <p class="small center mt-3 mb-0"><a href="#" id="ku-forgot-link">Zaboravio/la si lozinku?</a></p>
      <p class="small center mt-2 mb-0">Nemaš nalog? <a href="registracija.html">Registruj se</a></p>
    </form>

    <form id="ku-forgot-form" novalidate style="display:none;">
      <p class="small">Unesi email sa kojim si registrovan/a — poslaćemo ti link za postavljanje nove lozinke.</p>
      <div class="field">
        <label for="forgot-email">Email</label>
        <input type="email" id="forgot-email" required autocomplete="email" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Pošalji link za reset</button>
      <p class="small center mt-3 mb-0"><a href="#" id="ku-back-to-login">← Nazad na prijavu</a></p>
    </form>
  </div>
</div>

<footer id="ku-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/common.js"></script>
<script>
  const loginForm = document.getElementById("ku-login-form");
  const forgotForm = document.getElementById("ku-forgot-form");
  const errBox = document.getElementById("ku-error");
  const successBox = document.getElementById("ku-success");

  document.getElementById("ku-forgot-link").addEventListener("click", (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    successBox.style.display = "none";
    loginForm.style.display = "none";
    forgotForm.style.display = "block";
  });
  document.getElementById("ku-back-to-login").addEventListener("click", (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    successBox.style.display = "none";
    forgotForm.style.display = "none";
    loginForm.style.display = "block";
  });

  forgotForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    successBox.style.display = "none";
    const email = document.getElementById("forgot-email").value.trim();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    await KU.ready;
    try {
      await KU.store.posaljiResetLozinke(email);
      successBox.textContent = "Poslali smo ti email sa linkom za postavljanje nove lozinke — proveri inbox (i spam folder).";
      successBox.style.display = "block";
      forgotForm.reset();
    } catch (err) {
      errBox.textContent = "Greška: " + err.message;
      errBox.classList.add("show");
    }
    submitBtn.disabled = false;
  });

  document.getElementById("ku-login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    successBox.style.display = "none";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    await KU.ready;
    const user = await KU.store.login(email, password);
    if (!user) {
      errBox.textContent = "Pogrešan email ili lozinka.";
      errBox.classList.add("show");
      submitBtn.disabled = false;
      return;
    }
    kuToast("Dobrodošao/la nazad, " + user.ime.split(" ")[0] + "!");
    const redirect = kuQueryParam("redirect");
    if (redirect) {
      window.location.href = redirect;
    } else {
      window.location.href = user.role === "klijent" ? "panel-klijent.html" : "panel-izvodjac.html";
    }
  });
</script>
</body>
</html>
