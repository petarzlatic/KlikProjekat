<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zahtev — Usklik.rs</title>
<link rel="icon" type="image/png" href="img/usklik-icon-192.png" />
<link rel="apple-touch-icon" href="img/usklik-icon-180.png" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="ku-demo-banner" class="demo-banner"></div>
<header id="ku-header" class="site-header"></header>

<div class="page-wrap">
  <div class="container-narrow" id="ku-content">
    <!-- popunjava se skriptom -->
  </div>
</div>

<footer id="ku-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/common.js"></script>
<script>
(async () => {
  await KU.ready;
  const user = kuRequireAuth(null); // bilo koja uloga, samo da je prijavljen
  if (!user) return;
  const reqId = kuQueryParam("id");
  const mount = document.getElementById("ku-content");

  // Kalkulator materijala (28.10, vidi PLAN_Kalkulator_Materijala_v1.md)
  // — poslednja izračunata procena, zapamćena ovde da dugme "Kupi" (u
  // attachHandlers) ima šta da upiše u materijal_klikovi bez ponovnog
  // računanja.
  let poslednjaMaterijalProcena = null;

  /* Računa okvirnu procenu materijala iz STVARNIH stavki zahteva (ne iz
     ponude — stavke pripadaju zahtevu kao celini) i vraća HTML kartice,
     ili "" ako nema formula za ništa od izabranog (npr. kategorija bez
     definisanih formula). Puni se tek kad je posao dogovoren (status
     'u_toku') — pre toga klijent vidi samo informativnu procenu na
     novi-zahtev.html, bez pomena partnera/kupovine. */
  async function renderMaterijalKarta(req) {
    const stavke = await KU.store.getStavkeByRequest(req.id);
    if (stavke.length === 0) return "";
    const uslugaIds = stavke.map((s) => s.uslugaId);
    const formule = await KU.store.getMaterijalFormuleZaUsluge(uslugaIds);
    if (formule.length === 0) return "";

    const zbirPoMaterijalu = {};
    stavke.forEach((s) => {
      formule
        .filter((f) => f.uslugaId === s.uslugaId)
        .forEach((f) => {
          const kljuc = f.materijalNaziv + "|" + f.jedinica;
          zbirPoMaterijalu[kljuc] = (zbirPoMaterijalu[kljuc] || 0) + f.koeficijent * s.kolicina;
        });
    });

    const lista = Object.entries(zbirPoMaterijalu).map(([kljuc, kol]) => {
      const [naziv, jedinica] = kljuc.split("|");
      const zaokruzeno = kol < 10 ? Number(kol.toFixed(1)) : Math.round(kol);
      return { naziv, jedinica, kolicina: zaokruzeno };
    });
    if (lista.length === 0) return "";

    poslednjaMaterijalProcena = { requestId: req.id, lista };
    const partner = KU_CONFIG.PARTNER_PRODAVNICA;
    const stavkeLi = lista.map((s) => `<li>~${s.kolicina} ${s.jedinica} — ${kuEscape(s.naziv)}</li>`).join("");

    return `
      <div class="card mt-4" style="border-color:var(--color-primary-light); background:var(--color-primary-lighter);">
        <h3 class="mt-0">🧱 Preporučena kupovina materijala</h3>
        <ul class="small mb-2" style="margin:0 0 8px 18px; padding:0;">${stavkeLi}</ul>
        <p class="small muted mb-3">Okvirna procena — tačna količina zavisi od stanja površine, proveri na licu mesta pre kupovine.</p>
        <button type="button" class="btn btn-primary btn-sm" id="ku-kupi-materijal-btn">Kupi uz ${kuEscape(partner.popust)} popust — kod ${kuEscape(partner.kod)} (${kuEscape(partner.naziv)})</button>
      </div>`;
  }

  function statusBadge(status) {
    if (status === "otvoren") return '<span class="badge badge-open">Otvoren — čeka ponude</span>';
    if (status === "u_toku") return '<span class="badge badge-pending">Izvođač izabran</span>';
    if (status === "zavrsen") return '<span class="badge badge-done">Završen</span>';
    if (status === "otkazan") return '<span class="badge badge-done">Otkazan</span>';
    return "";
  }

  async function render() {
    const req = await KU.store.getRequestById(reqId);
    if (!req) {
      mount.innerHTML = `<div class="empty-state card"><h3>Zahtev nije pronađen</h3><p>Možda je uklonjen ili link nije ispravan.</p></div>`;
      return;
    }

    const client = await KU.store.getUserById(req.klijentId);
    const isOwner = user.role === "klijent" && user.id === req.klijentId;
    const isProvider = user.role === "izvodjac";
    const offers = await KU.store.getOffersByRequest(req.id);
    const acceptedOffer = offers.find((o) => o.status === "prihvacena");
    const myOffer = isProvider ? offers.find((o) => o.izvodjacId === user.id) : null;
    // Hibridni mehanizam v2 — da li sistem već predlaže automatsku ponudu
    // za ovaj zahtev baš ovom majstoru (čeka njegovu potvrdu u panelu).
    const mojPredlog = (isProvider && req.status === "otvoren")
      ? await KU.store.getMojPredlogZaZahtev(req.id, user.id)
      : null;
    // Kalkulator materijala — samo kad je posao dogovoren (vidi
    // renderMaterijalKarta gore za obrazloženje).
    const materijalKartaHtml = req.status === "u_toku" ? await renderMaterijalKarta(req) : "";

    const terminText = kuFormatTermin(req);
    let html = `
      <div class="flex-between" style="flex-wrap:wrap; gap:8px;">
        <span class="badge" style="background:var(--color-primary-lighter); color:var(--color-primary);">${kuEscape(kuKategorijaNaziv(req.kategorija))}</span>
        ${req.hitno ? '<span class="badge badge-hitno"><span class="siren"></span> Hitna intervencija</span>' : ""}
        ${statusBadge(req.status)}
      </div>
      <h1 class="mt-3">${kuEscape(req.opis)}</h1>
      <p class="mb-0">📍 ${kuEscape(req.lokacija)} ${terminText ? "· 🗓 " + kuEscape(terminText) : ""}</p>
      <p class="small muted">Objavio/la ${kuEscape(client ? client.ime.split(" ")[0] : "—")} · ${kuFormatDate(req.createdAt)}</p>
      ${req.hitno ? '<div class="card mt-3" style="border-color:rgba(197,61,61,0.35); background:#fbecec;"><p class="small mb-0">Majstor koji se javi naplaćuje cenu izlaska na teren plus cenu popravke (okvirna procena) — vidi ponudu ispod.</p></div>' : ""}
      ${req.slikaUrl ? `<a href="${req.slikaUrl}" target="_blank" rel="noopener"><img src="${req.slikaUrl}" alt="Fotografija kvara" class="mt-3" style="max-width:280px; max-height:280px; border-radius:var(--radius); border:1px solid var(--color-border); display:block;" /></a>` : ""}
    `;

    if (isOwner && req.status === "otvoren") {
      html += `<button class="btn btn-outline btn-sm" id="ku-cancel-btn" type="button">Otkaži zahtev</button>`;
    }

    html += `<hr class="divider" />`;

    /* ---------- Prikaz za VLASNIKA zahteva (klijent) ---------- */
    if (isOwner) {
      if (req.status === "otvoren") {
        html += `<h2>Ponude (${offers.length})</h2>`;
        if (offers.length === 0) {
          html += `<div class="empty-state card"><div class="icon-circle">⏳</div><h3>Još nema ponuda</h3><p>Izvođači u tvojoj kategoriji i lokaciji vide zahtev — obično je potrebno malo vremena da se jave.</p></div>`;
        } else {
          const offerCards = await Promise.all(offers.map((o) => offerCardForClient(o)));
          html += offerCards.join("");
        }
      } else if (req.status === "u_toku" && acceptedOffer) {
        const izv = await KU.store.getUserById(acceptedOffer.izvodjacId);
        html += `
          <div class="card" style="border-color:var(--color-primary-light);">
            <h3 class="mt-0">Izabrao/la si izvođača</h3>
            <div class="flex gap-4 mt-3" style="align-items:center;">
              <div class="avatar avatar-lg">${kuInitials(izv.ime)}</div>
              <div>
                <strong>${kuEscape(izv.ime)}</strong>
                <div class="small">📞 ${kuEscape(izv.telefon)}</div>
                <a class="small" href="profil.html?id=${izv.id}">Pogledaj profil →</a>
              </div>
            </div>
            <p class="mt-3 mb-0 small">Dalji dogovor (tačan termin, cena) ide direktno sa izvođačem. Kad posao bude gotov, označi zahtev kao završen i ostavi ocenu.</p>
            <button class="btn btn-secondary mt-3" id="ku-complete-btn" type="button">Označi posao kao završen</button>
          </div>` + materijalKartaHtml;
      } else if (req.status === "zavrsen") {
        const izv = acceptedOffer ? await KU.store.getUserById(acceptedOffer.izvodjacId) : null;
        if (izv && !(await KU.store.hasRated(req.id))) {
          html += ratingFormHtml(izv);
        } else if (izv) {
          html += `<div class="success-box">Posao je označen kao završen i ocenjen. Hvala!</div>`;
        } else {
          html += `<div class="success-box">Posao je označen kao završen.</div>`;
        }
      } else if (req.status === "otkazan") {
        html += `<p class="muted">Ovaj zahtev je otkazan.</p>`;
      }
    }

    /* ---------- Prikaz za IZVOĐAČA ---------- */
    if (isProvider) {
      if (req.status === "otvoren") {
        // NAPOMENA: myOffer može biti status 'odbijena' ako je majstor
        // sam odbio SVOJ automatski predlog (dugme "Ne mogu" u tabu
        // "Predložene ponude") — zahtev ostaje otvoren i dalje, pa to NE
        // treba prikazati kao "poslao/la si ponudu, čekaš odgovor".
        const aktivnaPonuda = myOffer && myOffer.status !== "odbijena" ? myOffer : null;
        if (mojPredlog) {
          html += `
            <div class="card mt-3" style="border-color:var(--color-primary-light); background:var(--color-primary-lighter);">
              <h3 class="mt-0">🧮 Sistem ti predlaže gotovu ponudu za ovaj zahtev</h3>
              <p class="mb-2"><strong>${mojPredlog.cena != null ? Number(mojPredlog.cena).toLocaleString("sr-RS") + " RSD" : "—"}</strong> — obračunato na osnovu tvog cenovnika.</p>
              <p class="small mb-3">${kuEscape(mojPredlog.poruka)}</p>
              <a class="btn btn-primary btn-sm" href="panel-izvodjac.html?tab=predlozi">Otvori "Predložene ponude" i potvrdi ili odbij</a>
            </div>`;
        } else if (aktivnaPonuda) {
          html += `<div class="success-box">${myOfferSummary(aktivnaPonuda)} — čekaš odgovor klijenta.</div>`;
        } else {
          html += `<div id="ponudi"></div><h2>Javi se na ovaj zahtev</h2>` + offerFormHtml(req);
        }
      } else if (req.status === "u_toku") {
        if (acceptedOffer && acceptedOffer.izvodjacId === user.id) {
          html += `
            <div class="card" style="border-color:var(--color-primary-light);">
              <h3 class="mt-0">Klijent je prihvatio tvoju ponudu 🎉</h3>
              <div class="flex gap-4 mt-3" style="align-items:center;">
                <div class="avatar avatar-lg">${kuInitials(client.ime)}</div>
                <div>
                  <strong>${kuEscape(client.ime)}</strong>
                  <div class="small">📞 ${kuEscape(client.telefon)}</div>
                </div>
              </div>
              <p class="mt-3 mb-0 small">Dogovorite tačan termin i cenu direktno. Klijent će označiti posao kao završen i ostaviti ocenu nakon obavljenog posla.</p>
            </div>` + materijalKartaHtml;
        } else if (myOffer) {
          html += `<div class="empty-state card"><p>Klijent je izabrao drugog izvođača za ovaj zahtev.</p></div>`;
        } else {
          html += `<div class="empty-state card"><p>Ovaj zahtev više ne prima ponude — klijent je već izabrao izvođača.</p></div>`;
        }
      } else if (req.status === "zavrsen") {
        html += `<div class="empty-state card"><p>Ovaj posao je završen.</p></div>`;
      } else if (req.status === "otkazan") {
        html += `<p class="muted">Ovaj zahtev je otkazan.</p>`;
      }
    }

    mount.innerHTML = html;
    attachHandlers(req);
  }

  function cenaText(o) {
    const delovi = [];
    // Hibridni mehanizam v2 — automatski obračunata ukupna cena (vidi
    // supabase/functions/generate-auto-offers). Poruka već sadrži
    // itemizovan opis (koja usluga, kvadratura, cena po jedinici), pa se
    // ovde samo ističe ukupan iznos.
    if (o.izvor === "automatska" && o.cena != null) {
      delovi.push(`Ukupno: ${Number(o.cena).toLocaleString("sr-RS")} RSD`);
    }
    if (o.cenaIzlaska != null) delovi.push(`Izlazak: ${o.cenaIzlaska} din`);
    if (o.cenaPopravkeOd != null && o.cenaPopravkeDo != null) {
      delovi.push(`Popravka (procena): ${o.cenaPopravkeOd}–${o.cenaPopravkeDo} din`);
    }
    return delovi.join(" · ");
  }

  function myOfferSummary(o) {
    if (o.izvor === "automatska" && o.cena != null) {
      return `Poslao/la si automatski obračunatu ponudu (${Number(o.cena).toLocaleString("sr-RS")} RSD) — čekaš odgovor klijenta.`;
    }
    if (o.cenaIzlaska != null || o.cenaPopravkeOd != null) {
      const cena = cenaText(o);
      return "Poslao/la si ponudu" + (cena ? " (" + cena + ")" : "") + (o.poruka ? ` — „${kuEscape(o.poruka)}"` : "");
    }
    return `Poslao/la si ponudu: „${kuEscape(o.poruka)}"`;
  }

  async function offerCardForClient(o) {
    const izv = await KU.store.getUserById(o.izvodjacId);
    const stats = await KU.store.providerStats(izv.id);
    const cena = cenaText(o);
    return `
      <div class="card mt-4">
        <div class="flex-between" style="flex-wrap:wrap; gap:12px;">
          <div class="flex gap-3" style="align-items:center;">
            <div class="avatar">${kuInitials(izv.ime)}</div>
            <div>
              <a href="profil.html?id=${izv.id}"><strong>${kuEscape(izv.ime)}</strong></a>
              <div class="rating-summary">
                ${kuStarsHtml(stats.avg)}
                <span>${stats.count ? stats.avg.toFixed(1) + " (" + stats.count + ")" : "Bez ocena još"} · ${stats.poslovi} obavljenih poslova</span>
              </div>
            </div>
          </div>
          <button class="btn btn-primary btn-sm ku-accept-offer" data-offer="${o.id}" type="button">Prihvati ponudu</button>
        </div>
        ${cena ? `<p class="mt-3 mb-0"><span class="badge badge-hitno">${kuEscape(cena)}</span></p>` : ""}
        ${o.predlozeniDatum ? `<p class="mt-2 mb-0"><span class="badge badge-pending">Predlaže drugi datum: ${kuEscape(kuFormatDate(o.predlozeniDatum))}</span></p>` : ""}
        ${o.poruka ? `<p class="mt-3 mb-0">„${kuEscape(o.poruka)}"</p>` : ""}
      </div>`;
  }

  function offerFormHtml(req) {
    if (req.hitno) {
      const podrazumevanaCena = user.cenaIzlaskaHitno != null ? user.cenaIzlaskaHitno : "";
      return `
        <form id="ku-offer-form">
          <div class="grid grid-2">
            <div class="field">
              <label for="ku-offer-izlazak">Cena izlaska na teren (din)</label>
              <input type="number" id="ku-offer-izlazak" min="0" step="1" required value="${kuEscape(String(podrazumevanaCena))}" />
              <div class="hint">Podešava se u <a href="moj-profil.html">tvom profilu</a> — ovde je predpopunjena, po potrebi izmeni.</div>
            </div>
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label for="ku-offer-popravka-od">Cena popravke — od (din)</label>
              <input type="number" id="ku-offer-popravka-od" min="0" step="1" required />
            </div>
            <div class="field">
              <label for="ku-offer-popravka-do">Cena popravke — do (din)</label>
              <input type="number" id="ku-offer-popravka-do" min="0" step="1" required />
            </div>
          </div>
          <div class="field">
            <label for="ku-offer-msg">Napomena (opciono)</label>
            <textarea id="ku-offer-msg" placeholder="Npr. Mogu da stignem za 30-ak minuta."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Pošalji ponudu</button>
        </form>`;
    }
    return `
      <form id="ku-offer-form">
        <div class="field">
          <label for="ku-offer-msg">Tvoja poruka klijentu</label>
          <textarea id="ku-offer-msg" required placeholder="Npr. Mogu da izađem u dogovorenom terminu, imam iskustva sa sličnim poslovima..."></textarea>
        </div>
        <div class="field">
          <label for="ku-offer-datum">Ne mogu u traženom terminu — predlažem (opciono)</label>
          <input type="date" id="ku-offer-datum" min="${kuSutra()}" />
        </div>
        <button type="submit" class="btn btn-primary">Pošalji ponudu</button>
      </form>`;
  }

  function ratingFormHtml(izv) {
    return `
      <div class="card">
        <h3 class="mt-0">Oceni ${kuEscape(izv.ime.split(" ")[0])}</h3>
        <form id="ku-rating-form">
          <div class="field">
            <label>Ocena</label>
            <div id="ku-star-picker" style="font-size:1.6rem; cursor:pointer;"></div>
            <input type="hidden" id="ku-rating-value" value="5" />
          </div>
          <div class="field">
            <label for="ku-rating-comment">Komentar (opciono)</label>
            <textarea id="ku-rating-comment" placeholder="Kako je prošao posao?"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Sačuvaj ocenu</button>
        </form>
      </div>`;
  }

  function renderStarPicker() {
    const el = document.getElementById("ku-star-picker");
    if (!el) return;
    function draw(val) {
      el.innerHTML = [1, 2, 3, 4, 5].map((i) =>
        `<span data-val="${i}" style="color:${i <= val ? "var(--color-star)" : "#e3e0da"};">★</span>`
      ).join("");
    }
    let current = 5;
    draw(current);
    el.addEventListener("click", (e) => {
      const val = e.target.getAttribute("data-val");
      if (!val) return;
      current = Number(val);
      document.getElementById("ku-rating-value").value = current;
      draw(current);
    });
  }

  function attachHandlers(req) {
    const cancelBtn = document.getElementById("ku-cancel-btn");
    if (cancelBtn) cancelBtn.addEventListener("click", async () => {
      if (confirm("Sigurno želiš da otkažeš ovaj zahtev?")) {
        await KU.store.cancelRequest(req.id);
        render().catch((err) => { console.error(err); kuToast("Greška: " + err.message); });
      }
    });

    document.querySelectorAll(".ku-accept-offer").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        await KU.store.acceptOffer(btn.dataset.offer);
        kuToast("Izvođač je izabran — kontakt je otključan.");
        render().catch((err) => { console.error(err); kuToast("Greška: " + err.message); });
      });
    });

    const offerForm = document.getElementById("ku-offer-form");
    if (offerForm) offerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const poruka = document.getElementById("ku-offer-msg").value.trim();
      if (req.hitno) {
        const cenaIzlaska = document.getElementById("ku-offer-izlazak").value;
        const cenaPopravkeOd = document.getElementById("ku-offer-popravka-od").value;
        const cenaPopravkeDo = document.getElementById("ku-offer-popravka-do").value;
        if (!cenaIzlaska || !cenaPopravkeOd || !cenaPopravkeDo) return;
        await KU.store.createOffer({
          requestId: req.id, izvodjacId: user.id, poruka,
          cenaIzlaska, cenaPopravkeOd, cenaPopravkeDo,
        });
      } else {
        if (!poruka) return;
        const predlozeniDatum = document.getElementById("ku-offer-datum").value || null;
        await KU.store.createOffer({ requestId: req.id, izvodjacId: user.id, poruka, predlozeniDatum });
      }
      kuToast("Ponuda poslata!");
      render().catch((err) => { console.error(err); kuToast("Greška: " + err.message); });
    });

    const completeBtn = document.getElementById("ku-complete-btn");
    if (completeBtn) completeBtn.addEventListener("click", async () => {
      await KU.store.completeRequest(req.id);
      render().catch((err) => { console.error(err); kuToast("Greška: " + err.message); });
    });

    const kupiMaterijalBtn = document.getElementById("ku-kupi-materijal-btn");
    if (kupiMaterijalBtn) kupiMaterijalBtn.addEventListener("click", async () => {
      const partner = KU_CONFIG.PARTNER_PRODAVNICA;
      kupiMaterijalBtn.disabled = true;
      try {
        await KU.store.logMaterijalKlik({
          requestId: req.id,
          partnerNaziv: partner.naziv,
          procenaMaterijala: poslednjaMaterijalProcena,
        });
      } catch (err) {
        console.error("logMaterijalKlik greška:", err);
      }
      if (partner.url && partner.url !== "#") {
        window.open(partner.url, "_blank", "noopener");
      } else {
        kuToast("Test faza — partner prodavnica još nije dogovorena. Klik je zabeležen.");
      }
      kupiMaterijalBtn.disabled = false;
    });

    renderStarPicker();
    const ratingForm = document.getElementById("ku-rating-form");
    if (ratingForm) ratingForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const ocena = document.getElementById("ku-rating-value").value;
      const komentar = document.getElementById("ku-rating-comment").value.trim();
      const acceptedOffer = (await KU.store.getOffersByRequest(req.id)).find((o) => o.status === "prihvacena");
      await KU.store.addRating({
        requestId: req.id,
        izvodjacId: acceptedOffer.izvodjacId,
        klijentId: user.id,
        ocena,
        komentar,
      });
      kuToast("Hvala na oceni!");
      render().catch((err) => { console.error(err); kuToast("Greška: " + err.message); });
    });
  }

  if (reqId) {
    await render();
  } else {
    mount.innerHTML = `<div class="empty-state card"><h3>Nedostaje ID zahteva</h3></div>`;
  }
})().catch((err) => { console.error(err); kuToast("Greška: " + err.message); });
</script>
</body>
