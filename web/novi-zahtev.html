<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Objavi zahtev — Usklik.rs</title>
<link rel="icon" type="image/png" href="img/usklik-icon-192.png" />
<link rel="apple-touch-icon" href="img/usklik-icon-180.png" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="ku-demo-banner" class="demo-banner"></div>
<header id="ku-header" class="site-header"></header>

<div class="page-wrap">
  <div class="container-narrow">
    <h1>Objavi zahtev</h1>
    <p>Opiši šta ti treba — izvođači koji rade tu kategoriju usluge će videti zahtev i javiti se.</p>

    <div class="error-box" id="ku-error"></div>

    <form id="ku-req-form" novalidate>
      <div class="field">
        <label for="kategorija">Kategorija usluge</label>
        <select id="kategorija" required></select>
        <div class="hint">U ovoj fazi su otvorene samo najtraženije kategorije. Ostale stižu uskoro.</div>
      </div>

      <div class="field">
        <label for="opis">Opis posla</label>
        <textarea id="opis" required placeholder="Npr. Krečenje dvosobnog stana, oko 55m2, zidovi u dobrom stanju."></textarea>
      </div>

      <!-- Hibridni mehanizam v2 (10. septembar, vidi PLAN_Hibridni_Mehanizam_v2.md) —
           za pilot kategorije (krečenje, čišćenje) klijent bira konkretne usluge +
           kvadraturu umesto da se osloni samo na slobodan opis, a sistem odmah
           prikazuje okvirnu cenu na osnovu unetih cenovnika izvođača. -->
      <div class="field" id="ku-stavke-wrap" style="display:none;">
        <label for="kvadratura">Kvadratura (m²)</label>
        <input type="number" id="kvadratura" min="1" step="0.5" placeholder="Npr. 55" />

        <div class="mt-3" id="ku-usluge-checklist"></div>

        <div class="mt-3" id="ku-otezani-wrap" style="display:none;">
          <label style="display:flex; align-items:center; gap:8px; font-weight:400; font-size:0.9rem; border:1px solid var(--color-border); border-radius:8px; padding:8px 10px;">
            <input type="checkbox" id="otezani-uslovi" />
            Loše stanje objekta / otežani uslovi za rad (+25% na cenu)
          </label>
        </div>

        <div class="hint" id="ku-cena-okvirna"></div>
      </div>

      <div class="field">
        <label for="lokacija">Lokacija</label>
        <select id="lokacija" required></select>
      </div>

      <div class="field">
        <label>Željeni termin</label>
        <div class="radio-group" id="ku-tip-termina-group">
          <label class="radio-card selected" data-tip="tacan_datum">
            <input type="radio" name="tip-termina" value="tacan_datum" checked />
            <strong>Tačan datum</strong>
            <span>Znam tačno kada želim da radovi počnu.</span>
          </label>
          <label class="radio-card" data-tip="fleksibilan_period">
            <input type="radio" name="tip-termina" value="fleksibilan_period" />
            <strong>Fleksibilan period</strong>
            <span>Otprilike ovaj datum, uz malo fleksibilnosti.</span>
          </label>
          <label class="radio-card" data-tip="fleksibilan_mesec">
            <input type="radio" name="tip-termina" value="fleksibilan_mesec" />
            <strong>Samo mesec</strong>
            <span>Nije hitno — najviše mogućnosti, najviše ponuda.</span>
          </label>
        </div>

        <div id="ku-termin-datum-wrap" class="grid grid-2 mt-3">
          <div class="field mb-0">
            <label for="datum-pocetka" class="small">Datum početka</label>
            <input type="date" id="datum-pocetka" required />
          </div>
          <div class="field mb-0" id="ku-fleksibilnost-wrap" style="display:none;">
            <label for="fleksibilnost-dana" class="small">Fleksibilnost</label>
            <select id="fleksibilnost-dana">
              <option value="3">± 3 dana</option>
              <option value="5">± 5 dana</option>
              <option value="7">± 7 dana</option>
            </select>
          </div>
        </div>
        <div id="ku-termin-mesec-wrap" class="mt-3" style="display:none;">
          <label for="zeljeni-mesec" class="small">Mesec</label>
          <input type="month" id="zeljeni-mesec" />
        </div>
        <div class="hint">Najraniji mogući datum je sutra. Za kvar koji ne može da čeka, prijavi <a href="hitna-intervencija.html">hitnu intervenciju</a> umesto ovoga.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Objavi zahtev</button>
    </form>
  </div>
</div>

<footer id="ku-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/common.js"></script>
<script>
(async () => {
  await KU.ready;
  const user = kuRequireAuth("klijent");
  if (!user) return;

  function fillSelects() {
    const katSelect = document.getElementById("kategorija");
    const aktivne = KU_CONFIG.KATEGORIJE.filter((k) => kuKategorijaAktivna(k.id));
    katSelect.innerHTML =
      '<option value="">Izaberi kategoriju...</option>' +
      aktivne.map((k) => `<option value="${k.id}">${kuEscape(k.naziv)}</option>`).join("");

    // Ako je korisnik došao sa stranice pregleda potkategorija
    // (potkategorije-majstor.html / potkategorije-ciscenje.html), kategorija
    // je već izabrana preko linka — samo je unapred selektujemo ovde.
    const unapredKategorija = kuQueryParam("kategorija");
    if (unapredKategorija && aktivne.some((k) => k.id === unapredKategorija)) {
      katSelect.value = unapredKategorija;
    }

    const locSelect = document.getElementById("lokacija");
    locSelect.innerHTML =
      '<option value="">Izaberi deo grada...</option>' +
      KU_CONFIG.LOKACIJE.map((l) => `<option value="${l}">${kuEscape(l)}</option>`).join("");
  }
  fillSelects();

  /* ---- Hibridni mehanizam v2: usluge + kvadratura + okvirna cena ---- */
  const stanjeStavki = { usluge: [], cenovnik: [] };

  function osveziOkvirnuCenu() {
    const cenaEl = document.getElementById("ku-cena-okvirna");
    const kategorija = document.getElementById("kategorija").value;
    if (!kategorija || !kuKategorijaAutomatska(kategorija)) { cenaEl.textContent = ""; return; }

    const kvadratura = Number(document.getElementById("kvadratura").value);
    const izabraniIds = Array.from(document.querySelectorAll(".ku-usluga-check:checked")).map((cb) => cb.dataset.uslugaId);

    if (!kvadratura || kvadratura <= 0 || izabraniIds.length === 0) {
      cenaEl.textContent = "Unesi kvadraturu i izaberi bar jednu uslugu da vidiš okvirnu cenu.";
      return;
    }

    const otezanoCb = document.getElementById("otezani-uslovi");
    const otezano = !!(otezanoCb && otezanoCb.checked && kuKategorijaImaModifikator(kategorija));

    // Grupiši cenovnik po izvođaču, pa zadrži samo one izvođače koji imaju
    // unetu cenu za SVE trenutno izabrane usluge (samo takvi mogu da daju
    // kompletnu ponudu za ovu kombinaciju).
    const poIzvodjacu = {};
    stanjeStavki.cenovnik.forEach((c) => {
      if (!izabraniIds.includes(c.uslugaId)) return;
      if (!poIzvodjacu[c.izvodjacId]) poIzvodjacu[c.izvodjacId] = {};
      poIzvodjacu[c.izvodjacId][c.uslugaId] = c.cena;
    });

    const ukupnoPoIzvodjacu = Object.values(poIzvodjacu)
      .filter((cene) => izabraniIds.every((id) => cene[id] != null))
      .map((cene) => {
        let ukupno = izabraniIds.reduce((zbir, id) => zbir + cene[id] * kvadratura, 0);
        if (otezano) ukupno *= 1 + KU_CONFIG.OTEZANI_USLOVI_PROCENAT / 100;
        return Math.round(ukupno);
      });

    if (ukupnoPoIzvodjacu.length === 0) {
      cenaEl.textContent = "Trenutno nemamo izvođača sa unetim cenama za baš ovu kombinaciju usluga — ipak možeš da objaviš zahtev, javićemo ti se čim se pronađe izvođač.";
      return;
    }

    const min = Math.min(...ukupnoPoIzvodjacu);
    const max = Math.max(...ukupnoPoIzvodjacu);
    const fmt = (n) => n.toLocaleString("sr-RS");
    cenaEl.innerHTML = min === max
      ? `<strong>Okvirna cena: ${fmt(min)} RSD</strong>`
      : `<strong>Okvirna cena: ${fmt(min)}–${fmt(max)} RSD</strong> (u zavisnosti od izvođača)`;
  }

  async function osveziStavkeZaKategoriju() {
    const kategorija = document.getElementById("kategorija").value;
    const wrap = document.getElementById("ku-stavke-wrap");
    const listEl = document.getElementById("ku-usluge-checklist");
    const otezaniWrap = document.getElementById("ku-otezani-wrap");
    const cenaEl = document.getElementById("ku-cena-okvirna");

    stanjeStavki.usluge = [];
    stanjeStavki.cenovnik = [];
    listEl.innerHTML = "";
    cenaEl.textContent = "";

    if (!kategorija || !kuKategorijaAutomatska(kategorija)) {
      wrap.style.display = "none";
      return;
    }
    wrap.style.display = "block";
    otezaniWrap.style.display = kuKategorijaImaModifikator(kategorija) ? "block" : "none";

    const [sveUslugeKategorije, cenovnik] = await Promise.all([
      KU.store.getUslugeByKategorija(kategorija),
      KU.store.getCenovnikZaKategoriju(kategorija),
    ]);

    // Filtriraj i poređaj po KU_CONFIG.AUTOMATSKE_USLUGE — katalog ima i
    // starije/nepovezane stavke iz iste kategorije koje ovde ne treba
    // nuditi (vidi napomenu uz AUTOMATSKE_USLUGE u config.js).
    const dozvoljeniNazivi = (KU_CONFIG.AUTOMATSKE_USLUGE || {})[kategorija];
    const usluge = dozvoljeniNazivi
      ? dozvoljeniNazivi
          .map((naziv) => sveUslugeKategorije.find((u) => u.naziv === naziv))
          .filter(Boolean)
      : sveUslugeKategorije;

    stanjeStavki.usluge = usluge;
    stanjeStavki.cenovnik = cenovnik;

    listEl.innerHTML = usluge.map((u, i) => `
      <label style="display:flex; align-items:center; gap:8px; font-weight:400; font-size:0.9rem; border:1px solid var(--color-border); border-radius:8px; padding:8px 10px; margin-bottom:8px;">
        <input type="checkbox" class="ku-usluga-check" data-usluga-id="${u.id}" ${i === 0 ? "checked" : ""} />
        ${kuEscape(u.naziv)}
      </label>`).join("");

    listEl.querySelectorAll(".ku-usluga-check").forEach((cb) => cb.addEventListener("change", osveziOkvirnuCenu));
    osveziOkvirnuCenu();
  }

  document.getElementById("kategorija").addEventListener("change", osveziStavkeZaKategoriju);
  document.getElementById("kvadratura").addEventListener("input", osveziOkvirnuCenu);
  document.getElementById("otezani-uslovi").addEventListener("change", osveziOkvirnuCenu);
  osveziStavkeZaKategoriju();

  /* ---- Tip termina: 3 radio-kartice (tačan datum / fleksibilan period / samo mesec) ---- */
  const datumInput = document.getElementById("datum-pocetka");
  const mesecInput = document.getElementById("zeljeni-mesec");
  datumInput.min = kuSutra();
  mesecInput.min = new Date().toISOString().slice(0, 7);

  function trenutniTipTermina() {
    return document.querySelector('input[name="tip-termina"]:checked').value;
  }

  function osveziTerminPrikaz() {
    const tip = trenutniTipTermina();
    document.querySelectorAll("#ku-tip-termina-group .radio-card").forEach((card) => {
      card.classList.toggle("selected", card.dataset.tip === tip);
    });
    document.getElementById("ku-termin-datum-wrap").style.display = tip === "fleksibilan_mesec" ? "none" : "grid";
    document.getElementById("ku-fleksibilnost-wrap").style.display = tip === "fleksibilan_period" ? "block" : "none";
    document.getElementById("ku-termin-mesec-wrap").style.display = tip === "fleksibilan_mesec" ? "block" : "none";
    datumInput.required = tip !== "fleksibilan_mesec";
  }
  document.querySelectorAll('input[name="tip-termina"]').forEach((r) => r.addEventListener("change", osveziTerminPrikaz));
  osveziTerminPrikaz();

  document.getElementById("ku-req-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.getElementById("ku-error");
    errBox.classList.remove("show");

    const kategorija = document.getElementById("kategorija").value;
    const opis = document.getElementById("opis").value.trim();
    const lokacija = document.getElementById("lokacija").value;
    const tipTermina = trenutniTipTermina();

    if (!kategorija || !opis || !lokacija) {
      errBox.textContent = "Popuni kategoriju, opis i lokaciju.";
      errBox.classList.add("show");
      return;
    }
    if (tipTermina !== "fleksibilan_mesec" && !datumInput.value) {
      errBox.textContent = "Izaberi datum početka (najranije sutra).";
      errBox.classList.add("show");
      return;
    }
    if (tipTermina === "fleksibilan_mesec" && !mesecInput.value) {
      errBox.textContent = "Izaberi mesec kad želiš da radovi počnu.";
      errBox.classList.add("show");
      return;
    }

    // Hibridni mehanizam v2 — za pilot kategorije mora biti izabrana
    // kvadratura i bar jedna usluga, jer se na osnovu toga računa ponuda.
    let stavke = [];
    let otezaniUslovi = false;
    if (kuKategorijaAutomatska(kategorija)) {
      const kvadratura = Number(document.getElementById("kvadratura").value);
      const izabraneUsluge = Array.from(document.querySelectorAll(".ku-usluga-check:checked")).map((cb) => cb.dataset.uslugaId);
      if (!kvadratura || kvadratura <= 0) {
        errBox.textContent = "Unesi kvadraturu (m²).";
        errBox.classList.add("show");
        return;
      }
      if (izabraneUsluge.length === 0) {
        errBox.textContent = "Izaberi bar jednu uslugu sa spiska.";
        errBox.classList.add("show");
        return;
      }
      stavke = izabraneUsluge.map((uslugaId) => ({ uslugaId, kolicina: kvadratura }));
      const otezaniCb = document.getElementById("otezani-uslovi");
      otezaniUslovi = !!(otezaniCb && otezaniCb.checked && kuKategorijaImaModifikator(kategorija));
    }

    const datumPocetka = tipTermina !== "fleksibilan_mesec" ? datumInput.value : null;
    const fleksibilnostDana = tipTermina === "fleksibilan_period" ? Number(document.getElementById("fleksibilnost-dana").value) : null;
    const zeljeniMesec = tipTermina === "fleksibilan_mesec" ? mesecInput.value + "-01" : null;

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const req = await KU.store.createRequest({
        klijentId: user.id,
        kategorija,
        opis,
        lokacija,
        tipTermina,
        datumPocetka,
        fleksibilnostDana,
        zeljeniMesec,
        stavke,
        otezaniUslovi,
      });
      kuToast("Zahtev objavljen!");
      window.location.href = "zahtev.html?id=" + req.id;
    } catch (err) {
      errBox.textContent = "Greška: " + err.message;
      errBox.classList.add("show");
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
