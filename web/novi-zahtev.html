<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Objavi zahtev — Usklik.rs</title>
<link rel="icon" type="image/png" href="img/usklik-icon-192.png" />
<link rel="apple-touch-icon" href="img/usklik-icon-180.png" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="ku-demo-banner" class="demo-banner"></div>
<header id="ku-header" class="site-header"></header>

<div class="page-wrap">
  <div class="container-narrow">
    <h1>Objavi zahtev</h1>
    <p>Opiši šta ti treba — izvođači koji rade tu kategoriju usluge će videti zahtev i javiti se.</p>

    <div class="error-box" id="ku-error"></div>

    <form id="ku-req-form" novalidate>
      <div class="field">
        <label for="kategorija">Kategorija usluge</label>
        <select id="kategorija" required></select>
        <div class="hint">U ovoj fazi su otvorene samo najtraženije kategorije. Ostale stižu uskoro.</div>
      </div>

      <div class="field">
        <label for="opis">Opis posla</label>
        <textarea id="opis" required placeholder="Npr. Krečenje dvosobnog stana, oko 55m2, zidovi u dobrom stanju."></textarea>
      </div>

      <div class="field">
        <label for="lokacija">Lokacija</label>
        <select id="lokacija" required></select>
      </div>

      <div class="field">
        <label>Željeni termin</label>
        <div class="radio-group" id="ku-tip-termina-group">
          <label class="radio-card selected" data-tip="tacan_datum">
            <input type="radio" name="tip-termina" value="tacan_datum" checked />
            <strong>Tačan datum</strong>
            <span>Znam tačno kada želim da radovi počnu.</span>
          </label>
          <label class="radio-card" data-tip="fleksibilan_period">
            <input type="radio" name="tip-termina" value="fleksibilan_period" />
            <strong>Fleksibilan period</strong>
            <span>Otprilike ovaj datum, uz malo fleksibilnosti.</span>
          </label>
          <label class="radio-card" data-tip="fleksibilan_mesec">
            <input type="radio" name="tip-termina" value="fleksibilan_mesec" />
            <strong>Samo mesec</strong>
            <span>Nije hitno — najviše mogućnosti, najviše ponuda.</span>
          </label>
        </div>

        <div id="ku-termin-datum-wrap" class="grid grid-2 mt-3">
          <div class="field mb-0">
            <label for="datum-pocetka" class="small">Datum početka</label>
            <input type="date" id="datum-pocetka" required />
          </div>
          <div class="field mb-0" id="ku-fleksibilnost-wrap" style="display:none;">
            <label for="fleksibilnost-dana" class="small">Fleksibilnost</label>
            <select id="fleksibilnost-dana">
              <option value="3">± 3 dana</option>
              <option value="5">± 5 dana</option>
              <option value="7">± 7 dana</option>
            </select>
          </div>
        </div>
        <div id="ku-termin-mesec-wrap" class="mt-3" style="display:none;">
          <label for="zeljeni-mesec" class="small">Mesec</label>
          <input type="month" id="zeljeni-mesec" />
        </div>
        <div class="hint">Najraniji mogući datum je sutra. Za kvar koji ne može da čeka, prijavi <a href="hitna-intervencija.html">hitnu intervenciju</a> umesto ovoga.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Objavi zahtev</button>
    </form>
  </div>
</div>

<footer id="ku-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/common.js"></script>
<script>
(async () => {
  await KU.ready;
  const user = kuRequireAuth("klijent");
  if (!user) return;

  function fillSelects() {
    const katSelect = document.getElementById("kategorija");
    const aktivne = KU_CONFIG.KATEGORIJE.filter((k) => kuKategorijaAktivna(k.id));
    katSelect.innerHTML =
      '<option value="">Izaberi kategoriju...</option>' +
      aktivne.map((k) => `<option value="${k.id}">${kuEscape(k.naziv)}</option>`).join("");

    // Ako je korisnik došao sa stranice pregleda potkategorija
    // (potkategorije-majstor.html / potkategorije-ciscenje.html), kategorija
    // je već izabrana preko linka — samo je unapred selektujemo ovde.
    const unapredKategorija = kuQueryParam("kategorija");
    if (unapredKategorija && aktivne.some((k) => k.id === unapredKategorija)) {
      katSelect.value = unapredKategorija;
    }

    const locSelect = document.getElementById("lokacija");
    locSelect.innerHTML =
      '<option value="">Izaberi deo grada...</option>' +
      KU_CONFIG.LOKACIJE.map((l) => `<option value="${l}">${kuEscape(l)}</option>`).join("");
  }
  fillSelects();

  /* ---- Tip termina: 3 radio-kartice (tačan datum / fleksibilan period / samo mesec) ---- */
  const datumInput = document.getElementById("datum-pocetka");
  const mesecInput = document.getElementById("zeljeni-mesec");
  datumInput.min = kuSutra();
  mesecInput.min = new Date().toISOString().slice(0, 7);

  function trenutniTipTermina() {
    return document.querySelector('input[name="tip-termina"]:checked').value;
  }

  function osveziTerminPrikaz() {
    const tip = trenutniTipTermina();
    document.querySelectorAll("#ku-tip-termina-group .radio-card").forEach((card) => {
      card.classList.toggle("selected", card.dataset.tip === tip);
    });
    document.getElementById("ku-termin-datum-wrap").style.display = tip === "fleksibilan_mesec" ? "none" : "grid";
    document.getElementById("ku-fleksibilnost-wrap").style.display = tip === "fleksibilan_period" ? "block" : "none";
    document.getElementById("ku-termin-mesec-wrap").style.display = tip === "fleksibilan_mesec" ? "block" : "none";
    datumInput.required = tip !== "fleksibilan_mesec";
  }
  document.querySelectorAll('input[name="tip-termina"]').forEach((r) => r.addEventListener("change", osveziTerminPrikaz));
  osveziTerminPrikaz();

  document.getElementById("ku-req-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.getElementById("ku-error");
    errBox.classList.remove("show");

    const kategorija = document.getElementById("kategorija").value;
    const opis = document.getElementById("opis").value.trim();
    const lokacija = document.getElementById("lokacija").value;
    const tipTermina = trenutniTipTermina();

    if (!kategorija || !opis || !lokacija) {
      errBox.textContent = "Popuni kategoriju, opis i lokaciju.";
      errBox.classList.add("show");
      return;
    }
    if (tipTermina !== "fleksibilan_mesec" && !datumInput.value) {
      errBox.textContent = "Izaberi datum početka (najranije sutra).";
      errBox.classList.add("show");
      return;
    }
    if (tipTermina === "fleksibilan_mesec" && !mesecInput.value) {
      errBox.textContent = "Izaberi mesec kad želiš da radovi počnu.";
      errBox.classList.add("show");
      return;
    }

    const datumPocetka = tipTermina !== "fleksibilan_mesec" ? datumInput.value : null;
    const fleksibilnostDana = tipTermina === "fleksibilan_period" ? Number(document.getElementById("fleksibilnost-dana").value) : null;
    const zeljeniMesec = tipTermina === "fleksibilan_mesec" ? mesecInput.value + "-01" : null;

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const req = await KU.store.createRequest({
        klijentId: user.id,
        kategorija,
        opis,
        lokacija,
        tipTermina,
        datumPocetka,
        fleksibilnostDana,
        zeljeniMesec,
      });
      kuToast("Zahtev objavljen!");
      window.location.href = "zahtev.html?id=" + req.id;
    } catch (err) {
      errBox.textContent = "Greška: " + err.message;
      errBox.classList.add("show");
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
