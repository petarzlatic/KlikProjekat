<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moj profil — Usklik.rs</title>
<link rel="icon" type="image/png" href="img/usklik-icon-192.png" />
<link rel="apple-touch-icon" href="img/usklik-icon-180.png" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="ku-demo-banner" class="demo-banner"></div>
<header id="ku-header" class="site-header"></header>

<div class="page-wrap">
  <div class="container-narrow">
    <h1>Moj profil</h1>

    <div class="success-box" id="ku-success" style="display:none;">Sačuvano!</div>

    <form id="ku-profile-form">
      <div class="field">
        <label for="ime">Ime i prezime</label>
        <input type="text" id="ime" required />
      </div>
      <div class="field">
        <label for="telefon">Telefon</label>
        <input type="tel" id="telefon" required />
      </div>
      <div id="ku-izvodjac-fields" style="display:none;">
        <div class="field">
          <label>Kategorije usluga koje nudiš</label>
          <div id="ku-kategorije-checkboxes" class="grid grid-2"></div>
        </div>
        <div class="field">
          <label for="bio">Kratak opis / iskustvo</label>
          <textarea id="bio"></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Sačuvaj izmene</button>
    </form>
  </div>
</div>

<footer id="ku-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/common.js"></script>
<script>
(async () => {
  await KU.ready;
  const user = kuRequireAuth(null);
  if (!user) return;

  function renderKategorijeCheckboxes(selected) {
    const mount = document.getElementById("ku-kategorije-checkboxes");
    mount.innerHTML = KU_CONFIG.KATEGORIJE.map((k) => `
      <label style="display:flex; align-items:center; gap:8px; font-weight:400; font-size:0.9rem; border:1px solid var(--color-border); border-radius:8px; padding:8px 10px;">
        <input type="checkbox" value="${k.id}" class="ku-kat-cb" ${selected.includes(k.id) ? "checked" : ""} />
        ${kuEscape(k.naziv)}
      </label>`).join("");
  }

  function fillForm() {
    document.getElementById("ime").value = user.ime;
    document.getElementById("telefon").value = user.telefon;
    if (user.role === "izvodjac") {
      document.getElementById("ku-izvodjac-fields").style.display = "block";
      document.getElementById("bio").value = user.bio || "";
      renderKategorijeCheckboxes(user.kategorije || []);
    }
  }

  fillForm();

  document.getElementById("ku-profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const patch = {
      ime: document.getElementById("ime").value.trim(),
      telefon: document.getElementById("telefon").value.trim(),
    };
    if (user.role === "izvodjac") {
      patch.bio = document.getElementById("bio").value.trim();
      patch.kategorije = Array.from(document.querySelectorAll(".ku-kat-cb:checked")).map((c) => c.value);
    }
    try {
      await KU.store.updateUser(user.id, patch);
      document.getElementById("ku-success").style.display = "block";
      kuToast("Profil sačuvan.");
    } catch (err) {
      kuToast("Greška: " + err.message);
    }
  });
})();
</script>
</body>
</html>
